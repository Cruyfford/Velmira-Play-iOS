name: Prepare Core ML conversion tools for MW3 fine-tuned model
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/coreml-conversion-assets.yml'
permissions:
  contents: read
jobs:
  coreml:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download Linux Core ML conversion Python wheels
        run: |
          set -euxo pipefail
          mkdir -p wheels
          python -m pip download --only-binary=:all: --no-deps -d wheels 'coremltools>=9,<11'
          ls -lh wheels
      - uses: actions/upload-artifact@v4
        with:
          name: MW3-CoreML-Converter-Linux
          path: wheels/
          retention-days: 2
