name: Build Velmira Anime IPA
on:
  push:
    branches: [velmira-anime-ios]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -project VelmiraAnime.xcodeproj -scheme VelmiraAnime \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build/xcodebuild.log | grep -E "error:|warning: unre|BUILD" || true
          test -d build/Build/Products/Release-iphoneos/VelmiraAnime.app || { grep -E "error:" -A3 build/xcodebuild.log | head -80; exit 1; }
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/VelmiraAnime.app Payload/
          zip -qry VelmiraAnime.ipa Payload
          ls -la VelmiraAnime.ipa
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="velmira-anime-${{ github.run_number }}"
          gh release create "$TAG" VelmiraAnime.ipa --target "${{ github.sha }}" \
            --title "Velmira Anime IPA #${{ github.run_number }}" \
            --notes "IPA غير موقّع — ثبّته عبر TrollStore / Sideloadly / SideStore" --prerelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build/xcodebuild.log
