name: Validate detection metrics
on:
  push:
    paths:
      - "tools/evaluate_detection.py"
      - "tools/test_evaluate_detection.py"
      - ".github/workflows/detection-metrics.yml"
  pull_request:
    paths:
      - "tools/evaluate_detection.py"
      - "tools/test_evaluate_detection.py"
      - ".github/workflows/detection-metrics.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test measurement logic
        run: python3 -m unittest discover -s tools -p 'test_evaluate_detection.py' -v
